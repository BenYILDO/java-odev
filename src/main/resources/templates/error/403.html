<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>

    <style>

    <div class="mt-4">
        <a href="/" class="btn btn-dark"><i class="bi bi-house"></i> Ana Sayfa</a>

</html>
