<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa Bulunamadı – EmlakSistem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .error-box { max-width: 520px; margin: 120px auto; text-align: center; }
        .error-code { font-size: 7rem; font-weight: 800; color: #dee2e6; line-height: 1; }
        .error-icon { font-size: 4rem; color: #6c757d; }
    </style>
</head>
<body>
<div class="error-box px-3">
    <div class="error-code">404</div>
    <div class="error-icon mb-3"><i class="bi bi-map"></i></div>
    <h2 class="fw-bold">Sayfa Bulunamadı</h2>
    <p class="text-muted mb-1">Aradığınız ilan veya sayfa mevcut değil.</p>
    <p class="text-muted small" th:if="${mesaj}" th:text="${mesaj}"></p>
    <div class="mt-4 d-flex gap-2 justify-content-center">
        <a href="/" class="btn btn-dark"><i class="bi bi-house"></i> Ana Sayfa</a>
        <a href="/ilanlar" class="btn btn-outline-secondary"><i class="bi bi-list-ul"></i> İlanlara Git</a>
    </div>
</div>
</body>
</html>
