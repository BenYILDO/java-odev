<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">
<body>
<div th:fragment="content">

    <div class="mb-3">
        <a th:href="@{/danismanlar}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Danışmanlar
        </a>
    </div>

    <div class="card" style="max-width:600px;">
        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">
                <i class="bi bi-person-badge"></i>
                <span th:text="${agent.id == null} ? 'Yeni Danışman Ekle' : 'Danışmanı Düzenle'"></span>
            </h4>
        </div>
        <div class="card-body">
            <form th:if="${agent.id == null}"
                  th:action="@{/danismanlar/kaydet}" th:object="${agent}" method="post">
                <div th:replace="~{agent/form :: formFields}"></div>
            </form>
            <form th:if="${agent.id != null}"
                  th:action="@{/danismanlar/{id}/guncelle(id=${agent.id})}" th:object="${agent}" method="post">
                <div th:replace="~{agent/form :: formFields}"></div>
            </form>
        </div>
    </div>

    <div th:fragment="formFields">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label fw-bold">Ad *</label>
                <input type="text" th:field="*{ad}" class="form-control"
                       th:classappend="${#fields.hasErrors('ad')} ? 'is-invalid'" placeholder="Ad">
                <div class="invalid-feedback" th:errors="*{ad}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Soyad *</label>
                <input type="text" th:field="*{soyad}" class="form-control"
                       th:classappend="${#fields.hasErrors('soyad')} ? 'is-invalid'" placeholder="Soyad">
                <div class="invalid-feedback" th:errors="*{soyad}"></div>
            </div>
            <div class="col-12">
                <label class="form-label fw-bold">Telefon *</label>
                <input type="text" th:field="*{telefon}" class="form-control"
                       th:classappend="${#fields.hasErrors('telefon')} ? 'is-invalid'" placeholder="05XX XXX XX XX">
                <div class="invalid-feedback" th:errors="*{telefon}"></div>
            </div>
            <div class="col-12">
                <label class="form-label fw-bold">E-posta *</label>
                <input type="email" th:field="*{email}" class="form-control"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" placeholder="ornek@mail.com">
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>
            <div class="col-12">
                <label class="form-label fw-bold">Ofis *</label>
                <input type="text" th:field="*{ofis}" class="form-control"
                       th:classappend="${#fields.hasErrors('ofis')} ? 'is-invalid'" placeholder="Kadıköy Şubesi">
                <div class="invalid-feedback" th:errors="*{ofis}"></div>
            </div>
            <div class="col-12 mt-2">
                <button type="submit" class="btn btn-success me-2">
                    <i class="bi bi-save"></i> Kaydet
                </button>
                <a th:href="@{/danismanlar}" class="btn btn-outline-secondary">
                    <i class="bi bi-x"></i> İptal
                </a>
            </div>
        </div>
    </div>

</div>
</body>
</html>
