<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">
<body>
<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-people"></i> Emlak Danışmanları</h2>
        <a th:href="@{/danismanlar/yeni}" class="btn btn-success">
            <i class="bi bi-person-plus"></i> Yeni Danışman
        </a>
    </div>

    <div class="row g-3">
        <div class="col-md-4" th:each="a : ${danismanlar}">
            <div class="card h-100">
                <div class="card-body">
                    <div class="d-flex align-items-center mb-3">
                        <div class="bg-dark text-white rounded-circle d-flex align-items-center justify-content-center me-3"
                             style="width:48px;height:48px;font-size:1.3rem;">
                            <i class="bi bi-person"></i>
                        </div>
                        <div>
                            <h5 class="mb-0" th:text="${a.tamAd}"></h5>
                            <small class="text-muted" th:text="${a.ofis}"></small>
                        </div>
                    </div>
                    <p class="mb-1"><i class="bi bi-telephone"></i> <span th:text="${a.telefon}"></span></p>
                    <p class="mb-1"><i class="bi bi-envelope"></i> <span th:text="${a.email}"></span></p>
                    <p class="mb-0">
                        <i class="bi bi-building"></i>
                        <strong th:text="${#lists.size(a.ilanlar)}"></strong> İlan
                    </p>
                </div>
                <div class="card-footer bg-transparent d-flex gap-2">
                    <a th:href="@{/danismanlar/{id}/duzenle(id=${a.id})}" class="btn btn-sm btn-warning flex-grow-1">
                        <i class="bi bi-pencil"></i> Düzenle
                    </a>
                    <form th:action="@{/danismanlar/{id}/sil(id=${a.id})}" method="post"
                          onsubmit="return confirm('Bu danışmanı silmek istediğinize emin misiniz?')">
                        <button class="btn btn-sm btn-danger">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(danismanlar)}" class="col-12">
            <div class="alert alert-info">
                <i class="bi bi-info-circle"></i> Henüz danışman eklenmemiş.
            </div>
        </div>
    </div>

</div>
</body>
</html>
